<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="title">
  <title id="title">Frontend to browser platform to real-time experiences</title>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="220" rx="16" fill="#0d1117"/>

  <path d="M170 110 H250 M370 110 H450 M570 110 H650"
        stroke="url(#line)" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M170 110 H650" stroke="#22d3ee" stroke-width="2" fill="none"
        stroke-dasharray="12 200" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-212" dur="2.8s" repeatCount="indefinite"/>
  </path>

  <g font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <g transform="translate(90,70)">
      <rect width="160" height="80" rx="12" fill="#161b22" stroke="#30363d"/>
      <circle cx="20" cy="18" r="4" fill="#3b82f6">
        <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="80" y="36" fill="#e6edf3" font-size="14" font-weight="600">React / Next.js</text>
      <text x="80" y="56" fill="#8b949e" font-size="11">TypeScript · UI</text>
    </g>

    <g transform="translate(290,70)">
      <rect width="160" height="80" rx="12" fill="#161b22" stroke="#30363d"/>
      <circle cx="20" cy="18" r="4" fill="#22d3ee">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="80" y="36" fill="#e6edf3" font-size="14" font-weight="600">Browser APIs</text>
      <text x="80" y="56" fill="#8b949e" font-size="11">Canvas · Media · Workers</text>
    </g>

    <g transform="translate(490,70)">
      <rect width="160" height="80" rx="12" fill="#161b22" stroke="#30363d"/>
      <circle cx="20" cy="18" r="4" fill="#3b82f6">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="80" y="36" fill="#e6edf3" font-size="14" font-weight="600">Real-time</text>
      <text x="80" y="56" fill="#8b949e" font-size="11">WebRTC · WebSockets</text>
    </g>

    <g transform="translate(690,70)">
      <rect width="160" height="80" rx="12" fill="#161b22" stroke="#3b82f6" filter="url(#glow)"/>
      <text x="80" y="36" fill="#e6edf3" font-size="14" font-weight="600">Experiences</text>
      <text x="80" y="56" fill="#8b949e" font-size="11">Playback · collab · live</text>
    </g>
  </g>
</svg>
